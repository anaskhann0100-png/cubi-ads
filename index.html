<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubi 3D · 3D Rubik's Cube Solver & Speedcubing Timer</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --text: #f8fafc;
      --mute: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p.desc {
      color: var(--mute);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #0b0f19;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
      margin-bottom: 32px;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      font-size: 14px;
    }
    .footer-links a {
      color: var(--mute);
      text-decoration: none;
    }
    .footer-links a:hover {
      color: var(--text);
      text-decoration: underline;
    }
    .contact {
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cubi 3D</h1>
    <p class="desc">
      The ultimate 3D Rubik's Cube app featuring high-speed CFOP & Roux solvers, official WCA inspection timer, custom 3D cube models, and move notation visualizer.
    </p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.cubi.rubicscube" target="_blank" rel="noopener">
      Get it on Google Play
    </a>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="app-ads.txt">app-ads.txt</a>
      <a href="mailto:labnexon@gmail.com">Contact Support</a>
    </div>
    <div class="contact">
      &copy; 2026 Cubi 3D. Support: labnexon@gmail.com
    </div>
  </div>
</body>
</html>
